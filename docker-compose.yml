services:
  user-service:
    build: ./user-service
    ports: ["8081:8081"]
  order-service:
    build: ./order-service
    ports: ["8082:8082"]
  api-gateway:
    build: ./api-gateway
    ports: ["8080:8080"]
    environment:
      USER_SERVICE_URL: http://user-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
    depends_on: [user-service, order-service]
